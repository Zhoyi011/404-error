name: Build and Publish GitHub Release

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute release version and changelog notes
        id: ver
        run: |
          BASE_VERSION="$(node -e 'console.log(require("./package.json").version || "1.0.0")')"
          MAJOR_MINOR="$(echo "${BASE_VERSION}" | awk -F. '{print $1"."$2}')"
          RELEASE_VERSION="${BASE_VERSION}"

          if git rev-parse "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            LAST_TAG="$(git tag -l "v${MAJOR_MINOR}.*" --sort=-v:refname | head -n 1 || true)"
            if [ -n "${LAST_TAG}" ]; then
              LAST_PATCH="$(echo "${LAST_TAG#v}" | awk -F. '{print $3}' | sed 's/[^0-9].*//')"
              NEXT_PATCH=$(( ${LAST_PATCH:-0} + 1 ))
              RELEASE_VERSION="${MAJOR_MINOR}.${NEXT_PATCH}"
            else
              RELEASE_VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
            fi
          fi

          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            COMMIT_NOTES="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s%n%w(0,2,2)%b" -n 15 || true)"
          else
            COMMIT_NOTES="$(git log --no-merges -n 8 --pretty=format:"- %s%n%w(0,2,2)%b" || true)"
          fi
          if [ -z "${COMMIT_NOTES}" ]; then
            COMMIT_NOTES="$(git log -n 5 --pretty=format:"- %s" || true)"
          fi
          if [ -z "${COMMIT_NOTES}" ]; then
            COMMIT_NOTES="- 发布 v${RELEASE_VERSION} 客户端构建与体验优化"
          fi

          printf '%s\n' "${COMMIT_NOTES}" > /tmp/release-notes.txt
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/release-notes.txt

  build-windows-exe:
    name: Build Windows EXE (Tauri)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Sync version (${{ needs.resolve-version.outputs.version }})
        run: node scripts/sync-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate app icons
        run: node scripts/generate-icons.mjs

      - name: Build Tauri Windows EXE
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Collect Windows EXE artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          NSIS_EXE="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*-setup.exe' | head -n 1)"
          if [ -z "${NSIS_EXE}" ]; then
            echo "NSIS setup exe not found!"
            exit 1
          fi
          cp "${NSIS_EXE}" "artifacts/404-error-windows.exe"
          if [ -f "src-tauri/target/release/horror-404.exe" ]; then
            cp "src-tauri/target/release/horror-404.exe" "artifacts/404-error-windows-portable.exe"
          fi
          ls -lh artifacts/

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/*.exe

  build-linux:
    name: Build Linux AppImage & DEB (Tauri)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            squashfs-tools \
            xdg-utils
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Sync version (${{ needs.resolve-version.outputs.version }})
        run: node scripts/sync-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate app icons
        run: node scripts/generate-icons.mjs

      - name: Build Tauri Linux AppImage and DEB
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb

      - name: Collect Linux artifacts
        run: |
          mkdir -p artifacts
          APPIMAGE_FILE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1 || true)"
          DEB_FILE="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1 || true)"

          if [ -z "${APPIMAGE_FILE}" ]; then
            echo "AppImage bundle not found under src-tauri/target/release/bundle/appimage!"
            ls -la src-tauri/target/release/bundle/ || true
            exit 1
          fi
          if [ -z "${DEB_FILE}" ]; then
            echo "DEB bundle not found under src-tauri/target/release/bundle/deb!"
            ls -la src-tauri/target/release/bundle/ || true
            exit 1
          fi

          cp "${APPIMAGE_FILE}" "artifacts/404-error-linux.AppImage"
          chmod +x "artifacts/404-error-linux.AppImage"
          cp "${DEB_FILE}" "artifacts/404-error-linux.deb"
          ls -lh artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            artifacts/404-error-linux.AppImage
            artifacts/404-error-linux.deb

  build-android-apk:
    name: Build Android APK (Capacitor)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android 34 SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${SDK_DIR}" ] && [ -d "/opt/android-sdk" ]; then
            SDK_DIR="/opt/android-sdk"
          fi
          echo "ANDROID_HOME=${SDK_DIR}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "${GITHUB_ENV}"

          CMDLINE_BIN="${SDK_DIR}/cmdline-tools/latest/bin"
          if [ ! -d "${CMDLINE_BIN}" ]; then
            CMDLINE_BIN="$(find "${SDK_DIR}/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "${CMDLINE_BIN}" ] || [ ! -x "${CMDLINE_BIN}/sdkmanager" ]; then
            echo "sdkmanager not found under ${SDK_DIR}"
            exit 1
          fi

          echo "${CMDLINE_BIN}" >> "${GITHUB_PATH}"
          echo "${SDK_DIR}/platform-tools" >> "${GITHUB_PATH}"
          export PATH="${CMDLINE_BIN}:${SDK_DIR}/platform-tools:${PATH}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          MISSING_PKGS=""
          if [ ! -d "${SDK_DIR}/platforms/android-34" ]; then
            MISSING_PKGS="${MISSING_PKGS} platforms;android-34"
          fi
          if [ ! -d "${SDK_DIR}/build-tools/34.0.0" ]; then
            MISSING_PKGS="${MISSING_PKGS} build-tools;34.0.0"
          fi
          if [ ! -d "${SDK_DIR}/platform-tools" ]; then
            MISSING_PKGS="${MISSING_PKGS} platform-tools"
          fi

          if [ -n "${MISSING_PKGS}" ]; then
            echo "Installing missing Android SDK components:${MISSING_PKGS}"
            sdkmanager ${MISSING_PKGS}
          else
            echo "Android 34 SDK components already installed."
          fi

      - name: Install root npm dependencies
        run: npm install --legacy-peer-deps

      - name: Sync version (${{ needs.resolve-version.outputs.version }})
        run: node scripts/sync-version.mjs "${{ needs.resolve-version.outputs.version }}"

      - name: Build Android APK (Release signed if Secrets configured, else Debug fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x packaging/build-apk.sh
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > /tmp/release.keystore
            export ANDROID_KEYSTORE_PATH="/tmp/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}"
            export ANDROID_KEY_ALIAS="${KEY_ALIAS}"
            export ANDROID_KEY_PASSWORD="${KEY_PASSWORD}"
            bash packaging/build-apk.sh release
          else
            echo "::notice::KEYSTORE_BASE64 secret is not configured yet; building debug-signed APK fallback."
            bash packaging/build-apk.sh debug
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packaging/android-capacitor/404-error-android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-windows-exe, build-linux, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Install release-notes dependencies
        run: npm install --omit=dev --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps || true

      - name: Generate version.json & Polish Chinese release notes
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_NOTES_FILE: release-assets/release-notes.txt
          OUT_RELEASE_NOTES_MD: /tmp/polished-release-notes.md
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-version-json.mjs release-assets/version.json
          cat release-assets/version.json
          ls -lh release-assets/

      - name: Prepare release body
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          if [ -s /tmp/polished-release-notes.md ]; then
            NOTES_CONTENT="$(cat /tmp/polished-release-notes.md)"
          elif [ -s release-assets/release-notes.txt ]; then
            NOTES_CONTENT="$(cat release-assets/release-notes.txt)"
          else
            NOTES_CONTENT="- 优化跨平台客户端运行性能与离线游玩体验"
          fi
          {
            echo "## 伪人入侵 ${RELEASE_TAG}"
            echo ""
            echo "${NOTES_CONTENT}"
            echo ""
            echo "### 安装包说明"
            echo '- **Windows (.exe)**：`404-error-windows.exe`（安装版） / `404-error-windows-portable.exe`（单文件绿色版）'
            echo '- **Linux (x86_64)**：`404-error-linux.AppImage`（通用便携运行版） / `404-error-linux.deb`（Debian / Ubuntu 安装包）'
            echo '- **Android (.apk)**：`404-error-android.apk`'
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "伪人入侵 ${{ needs.resolve-version.outputs.tag }}"
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/404-error-windows.exe
            release-assets/404-error-windows-portable.exe
            release-assets/404-error-linux.AppImage
            release-assets/404-error-linux.deb
            release-assets/404-error-android.apk
            release-assets/version.json